syntax = "proto3";

package secret_service;

service SecretService {
    rpc CreateSecret     (CreateSecretRequest)   returns (SimpleSecretResponse);
    // Status code contract: NOT_FOUND means no secret exists for this key
    // (confirmed absent -- safe for a caller to provision a new value in its
    // place). Any other non-OK status (typically INTERNAL) means the lookup
    // itself failed and must never be treated as "doesn't exist" -- clients
    // should branch on status.code(), not on the message text, which may
    // change.
    rpc GetSecret        (GetSecretRequest)      returns (GetSecretResponse);
    rpc GetAllSecrets    (GetAllSecretsRequest)  returns (GetAllSecretsResponse);
    rpc UpdateSecret     (UpdateSecretRequest)   returns (SimpleSecretResponse);
    rpc DeleteSecret     (DeleteSecretRequest)   returns (SimpleSecretResponse);
}

message CreateSecretRequest {
    string runner_id      = 1;
    string environment_id = 2;
    string secret_key     = 3;
    string value          = 4;
    string actor          = 5;
  // RBAC Phase 3 -- exactly one of these two is required; a request with
  // neither is rejected. `actor` is informational only: the server records
  // the authenticated identity instead of trusting it.
  string access_token       = 6;
  string service_credential = 7;
}

message GetSecretRequest {
    string runner_id      = 1;
    string environment_id = 2;
    string secret_key     = 3;
    int64  version        = 4;
    string actor          = 5;
  // RBAC Phase 3 -- exactly one of these two is required; a request with
  // neither is rejected. `actor` is informational only: the server records
  // the authenticated identity instead of trusting it.
  string access_token       = 6;
  string service_credential = 7;
}

message UpdateSecretRequest {
    string runner_id      = 1;
    string environment_id = 2;
    string secret_key     = 3;
    string new_value      = 4;
    string actor          = 5;
  // RBAC Phase 3 -- exactly one of these two is required; a request with
  // neither is rejected. `actor` is informational only: the server records
  // the authenticated identity instead of trusting it.
  string access_token       = 6;
  string service_credential = 7;
}

message DeleteSecretRequest {
    string runner_id      = 1;
    string environment_id = 2;
    string secret_key     = 3;
  // RBAC Phase 3 -- exactly one of these two is required; a request with
  // neither is rejected. `actor` is informational only: the server records
  // the authenticated identity instead of trusting it.
  string access_token       = 4;
  string service_credential = 5;
}

message GetSecretResponse {
    string secret_key     = 1;
    bytes  value          = 2;
}

message SimpleSecretResponse {
    bool success = 1;
}

message GetAllSecretsRequest {
    string runner_id      = 1;
    string environment_id = 2;
    int64  version        = 3;
  // RBAC Phase 3 -- exactly one of these two is required; a request with
  // neither is rejected. `actor` is informational only: the server records
  // the authenticated identity instead of trusting it.
  string access_token       = 4;
  string service_credential = 5;
}

message GetAllSecretsResponse {
    repeated KeyValuePair vals = 1;
}

message KeyValuePair { 
    string key   = 1;
    bytes  value = 2;
}